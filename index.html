<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>TijaraPro - منصة المتاجر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#111;
  color:#fff;
}

button,input{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin:25px 0 8px;
}

.logo span{
  color:#ff8a00;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

.card{
  background:#1b1b1b;
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #333;
  border-radius:12px;
  background:#111;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:#ff8a00;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#ff8a00;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.secondary{
  background:#292929;
  color:#fff;
}

.hidden{
  display:none!important;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  background:#292929;
  color:#ddd;
  text-align:center;
}

.store-box{
  background:#111;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
}

.label{
  color:#999;
  font-size:13px;
  margin-top:10px;
}

.value{
  font-size:17px;
  margin-top:4px;
}

.logout{
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">
    TIJARA<span>PRO</span>
  </div>

  <div class="subtitle">
    أنشئ متجرك الإلكتروني بسهولة
  </div>

  <!-- AUTH -->
  <div id="authScreen">

    <div class="card">

      <h2 id="authTitle">إنشاء حساب</h2>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="new-password"
      >

      <button id="authButton" onclick="register()">
        إنشاء الحساب
      </button>

      <button
        class="secondary"
        id="switchButton"
        onclick="switchAuth()"
      >
        لدي حساب بالفعل
      </button>

      <div id="authMessage" class="message hidden"></div>

    </div>

  </div>


  <!-- CREATE STORE -->
  <div id="storeScreen" class="hidden">

    <div class="card">

      <h2>أنشئ متجرك</h2>

      <p style="color:#aaa">
        أدخل معلومات متجرك لبدء البيع.
      </p>

      <input
        id="storeName"
        type="text"
        placeholder="اسم المتجر"
      >

      <input
        id="storeSlug"
        type="text"
        placeholder="رابط المتجر مثال: my-store"
      >

      <input
        id="storePhone"
        type="tel"
        placeholder="رقم الهاتف"
      >

      <input
        id="storeWilaya"
        type="text"
        placeholder="الولاية"
      >

      <button onclick="createStore()">
        إنشاء المتجر
      </button>

      <div id="storeMessage" class="message hidden"></div>

    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboardScreen" class="hidden">

    <div class="card">

      <h2>لوحة التحكم</h2>

      <p style="color:#aaa">
        مرحبًا بك في متجرك.
      </p>

      <div class="store-box">

        <div class="label">اسم المتجر</div>
        <div class="value" id="dashboardName">-</div>

        <div class="label">رابط المتجر</div>
        <div class="value" id="dashboardSlug">-</div>

        <div class="label">رقم الهاتف</div>
        <div class="value" id="dashboardPhone">-</div>

        <div class="label">الولاية</div>
        <div class="value" id="dashboardWilaya">-</div>

      </div>

      <button class="logout" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kxpzmuxnibmldsmbztgw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NOYkYqk-zaJ2YeegoBqdbw_P6FMde8L";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATE
========================= */

let loginMode = false;


/* =========================
   ELEMENTS
========================= */

const authScreen =
document.getElementById("authScreen");

const storeScreen =
document.getElementById("storeScreen");

const dashboardScreen =
document.getElementById("dashboardScreen");

const authTitle =
document.getElementById("authTitle");

const authButton =
document.getElementById("authButton");

const switchButton =
document.getElementById("switchButton");

const authMessage =
document.getElementById("authMessage");

const storeMessage =
document.getElementById("storeMessage");


/* =========================
   AUTH MODE
========================= */

function switchAuth(){

  loginMode = !loginMode;

  if(loginMode){

    authTitle.textContent = "تسجيل الدخول";

    authButton.textContent = "دخول";

    switchButton.textContent =
      "ليس لدي حساب";

  }else{

    authTitle.textContent = "إنشاء حساب";

    authButton.textContent =
      "إنشاء الحساب";

    switchButton.textContent =
      "لدي حساب بالفعل";

  }

  hideMessage(authMessage);
}


/* =========================
   MESSAGE
========================= */

function showMessage(element,text){

  element.textContent = text;
  element.classList.remove("hidden");

}

function hideMessage(element){

  element.classList.add("hidden");

}


/* =========================
   REGISTER / LOGIN
========================= */

async function register(){

  hideMessage(authMessage);

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showMessage(
      authMessage,
      "أدخل البريد الإلكتروني وكلمة المرور."
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      authMessage,
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
    );

    return;
  }


  authButton.disabled = true;
  authButton.textContent = "جارٍ المعالجة...";


  try{

    if(loginMode){

      const {error} =
        await supabaseClient.auth.signInWithPassword({
          email:email,
          password:password
        });

      if(error) throw error;

      await loadUser();

    }else{

      const {data,error} =
        await supabaseClient.auth.signUp({
          email:email,
          password:password
        });

      if(error) throw error;


      if(data.session){

        await loadUser();

      }else{

        showMessage(
          authMessage,
          "تم إنشاء الحساب. إذا طُلب منك تأكيد البريد، افتح رسالة Supabase ثم سجّل الدخول."
        );

        loginMode = true;

        authTitle.textContent =
          "تسجيل الدخول";

        authButton.textContent =
          "دخول";

        switchButton.textContent =
          "ليس لدي حساب";

      }

    }

  }catch(error){

    showMessage(
      authMessage,
      translateError(error.message)
    );

  }


  authButton.disabled = false;

  authButton.textContent =
    loginMode ? "دخول" : "إنشاء الحساب";
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    showScreen("auth");

    return;
  }


  const {
    data:stores,
    error
  } =
  await supabaseClient
    .from("stores")
    .select("*")
    .eq("owner_id",user.id)
    .limit(1);


  if(error){

    console.error(error);

    showMessage(
      authMessage,
      "حدث خطأ أثناء قراءة المتجر."
    );

    showScreen("auth");

    return;
  }


  if(stores && stores.length > 0){

    showDashboard(stores[0]);

  }else{

    showScreen("store");

  }

}


/* =========================
   CREATE STORE
========================= */

async function createStore(){

  hideMessage(storeMessage);

  const name =
    document.getElementById("storeName")
      .value.trim();

  const slug =
    document.getElementById("storeSlug")
      .value.trim()
      .toLowerCase()
      .replace(/\s+/g,"-");

  const phone =
    document.getElementById("storePhone")
      .value.trim();

  const wilaya =
    document.getElementById("storeWilaya")
      .value.trim();


  if(!name || !slug){

    showMessage(
      storeMessage,
      "أدخل اسم المتجر والرابط."
    );

    return;
  }


  if(!/^[a-z0-9-]+$/.test(slug)){

    showMessage(
      storeMessage,
      "الرابط يجب أن يحتوي على أحرف إنجليزية وأرقام وشرطة فقط."
    );

    return;
  }


  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    showMessage(
      storeMessage,
      "انتهت الجلسة. سجّل الدخول من جديد."
    );

    showScreen("auth");

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("stores")
    .insert({
      owner_id:user.id,
      name:name,
      slug:slug,
      phone:phone,
      wilaya:wilaya
    })
    .select()
    .single();


  if(error){

    console.error(error);

    if(error.code === "23505"){

      showMessage(
        storeMessage,
        "رابط المتجر مستخدم بالفعل. اختر رابطًا آخر."
      );

    }else{

      showMessage(
        storeMessage,
        "تعذر إنشاء المتجر: " + error.message
      );

    }

    return;
  }


  showDashboard(data);

}


/* =========================
   DASHBOARD
========================= */

function showDashboard(store){

  document.getElementById("dashboardName")
    .textContent = store.name || "-";

  document.getElementById("dashboardSlug")
    .textContent = store.slug || "-";

  document.getElementById("dashboardPhone")
    .textContent = store.phone || "-";

  document.getElementById("dashboardWilaya")
    .textContent = store.wilaya || "-";

  showScreen("dashboard");

}


/* =========================
   SCREEN
========================= */

function showScreen(screen){

  authScreen.classList.add("hidden");
  storeScreen.classList.add("hidden");
  dashboardScreen.classList.add("hidden");


  if(screen === "auth")
    authScreen.classList.remove("hidden");

  if(screen === "store")
    storeScreen.classList.remove("hidden");

  if(screen === "dashboard")
    dashboardScreen.classList.remove("hidden");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  loginMode = true;

  authTitle.textContent =
    "تسجيل الدخول";

  authButton.textContent =
    "دخول";

  switchButton.textContent =
    "ليس لدي حساب";

  showScreen("auth");

}


/* =========================
   ERROR TRANSLATION
========================= */

function translateError(message){

  if(message.includes("Invalid login credentials"))
    return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

  if(message.includes("User already registered"))
    return "هذا البريد مسجل بالفعل.";

  if(message.includes("Password should be at least"))
    return "كلمة المرور قصيرة جدًا.";

  if(message.includes("Email not confirmed"))
    return "يجب تأكيد البريد الإلكتروني أولًا.";

  return message;
}


/* =========================
   SESSION CHECK
========================= */

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      loadUser();

    }

  }
);


/* =========================
   START
========================= */

loadUser();

</script>

</body>
</html>
