<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>TijaraPro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#111;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* AUTH */
.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#111;
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#ff8a00;
}

.auth-subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  outline:none;
  background:#fff;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#ff8a00;
}

.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
}

.btn-primary{
  background:#ff8a00;
  color:#fff;
}

.btn-dark{
  background:#111;
  color:#fff;
}

.btn-danger{
  background:#e53935;
  color:#fff;
}

.btn-small{
  width:auto;
  padding:10px 15px;
  font-size:14px;
}

.switch-auth{
  text-align:center;
  margin-top:18px;
  color:#666;
}

.switch-auth button{
  border:0;
  background:none;
  color:#ff8a00;
  font-weight:bold;
  font-size:15px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
  display:none;
}

.message.error{
  display:block;
  background:#ffe8e8;
  color:#b00020;
}

.message.success{
  display:block;
  background:#e8f8ed;
  color:#16803c;
}

/* CREATE STORE */
.create-page{
  min-height:100vh;
  background:#111;
  padding:30px 15px;
}

.create-box{
  width:100%;
  max-width:500px;
  margin:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
}

/* DASHBOARD */
.dashboard{
  min-height:100vh;
  background:#f5f5f5;
}

.topbar{
  background:#111;
  color:#fff;
  padding:16px;
  position:sticky;
  top:0;
  z-index:20;
}

.topbar-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.brand span{
  color:#ff8a00;
}

.logout-btn{
  border:1px solid #555;
  background:transparent;
  color:#fff;
  padding:9px 13px;
  border-radius:10px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px 15px 100px;
}

.store-header{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.store-header h1{
  margin:0 0 8px;
  font-size:25px;
}

.store-meta{
  color:#777;
  font-size:14px;
  line-height:1.8;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat-title{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.stat-value{
  font-size:27px;
  font-weight:900;
}

/* PRODUCTS */
.section{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
  margin-bottom:18px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-size:21px;
}

.add-btn{
  background:#ff8a00;
  color:#fff;
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:bold;
}

.product-form{
  display:none;
  border:1px solid #eee;
  background:#fafafa;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
}

.product-form.open{
  display:block;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product-card{
  border:1px solid #eee;
  border-radius:15px;
  overflow:hidden;
  background:#fff;
}

.product-image{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#eee;
  display:block;
}

.no-image{
  width:100%;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#999;
}

.product-info{
  padding:12px;
}

.product-name{
  font-weight:bold;
  margin-bottom:7px;
  word-break:break-word;
}

.product-price{
  color:#ff8a00;
  font-size:18px;
  font-weight:900;
  margin-bottom:5px;
}

.product-stock{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.delete-product{
  width:100%;
  border:0;
  background:#fff0f0;
  color:#d60000;
  border-radius:9px;
  padding:9px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#888;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

/* MOBILE */
@media(min-width:700px){
  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .product-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- AUTH -->
  <section id="authPage" class="auth-page">
    <div class="auth-box">

      <div class="logo">
        TIJARA<span>PRO</span>
      </div>

      <div class="auth-subtitle">
        أنشئ متجرك الإلكتروني بسهولة
      </div>

      <div id="authMessage" class="message"></div>

      <div id="loginForm">

        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="loginEmail" type="email" placeholder="example@email.com">
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input id="loginPassword" type="password" placeholder="كلمة المرور">
        </div>

        <button class="btn btn-primary" onclick="login()">
          دخول
        </button>

        <div class="switch-auth">
          ليس لديك حساب؟
          <button onclick="showRegister()">إنشاء حساب</button>
        </div>

      </div>

      <div id="registerForm" class="hidden">

        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="registerEmail" type="email" placeholder="example@email.com">
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input id="registerPassword" type="password" placeholder="6 أحرف على الأقل">
        </div>

        <button class="btn btn-primary" onclick="register()">
          إنشاء الحساب
        </button>

        <div class="switch-auth">
          لدي حساب بالفعل
          <button onclick="showLogin()">دخول</button>
        </div>

      </div>

    </div>
  </section>


  <!-- CREATE STORE -->
  <section id="createStorePage" class="create-page hidden">

    <div class="create-box">

      <div class="logo">
        TIJARA<span>PRO</span>
      </div>

      <h2>أنشئ متجرك</h2>

      <p style="color:#777">
        أدخل معلومات متجرك للبدء.
      </p>

      <div id="storeMessage" class="message"></div>

      <div class="field">
        <label>اسم المتجر</label>
        <input id="storeName" type="text" placeholder="مثال: متجري الإلكتروني">
      </div>

      <div class="field">
        <label>رابط المتجر</label>
        <input id="storeSlug" type="text" placeholder="my-store">
      </div>

      <div class="field">
        <label>رقم الهاتف</label>
        <input id="storePhone" type="tel" placeholder="05 أو 06 أو 07">
      </div>

      <div class="field">
        <label>الولاية</label>
        <input id="storeWilaya" type="text" placeholder="المدية">
      </div>

      <button class="btn btn-primary" onclick="createStore()">
        إنشاء المتجر
      </button>

    </div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboardPage" class="dashboard hidden">

    <header class="topbar">
      <div class="topbar-inner">

        <div class="brand">
          TIJARA<span>PRO</span>
        </div>

        <button class="logout-btn" onclick="logout()">
          تسجيل الخروج
        </button>

      </div>
    </header>

    <main class="container">

      <div class="store-header">

        <h1 id="dashboardStoreName">
          متجري
        </h1>

        <div id="storeMeta" class="store-meta">
          جاري التحميل...
        </div>

      </div>


      <div class="stats">

        <div class="stat">
          <div class="stat-title">المنتجات</div>
          <div id="productsCount" class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">الطلبات</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">العملاء</div>
          <div class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">المبيعات</div>
          <div class="stat-value">0 دج</div>
        </div>

      </div>


      <!-- PRODUCTS -->
      <div class="section">

        <div class="section-head">

          <h2>المنتجات</h2>

          <button class="add-btn" onclick="toggleProductForm()">
            + إضافة منتج
          </button>

        </div>


        <div id="productForm" class="product-form">

          <div id="productMessage" class="message"></div>

          <div class="field">
            <label>اسم المنتج</label>
            <input id="productName" type="text" placeholder="مثال: هاتف Samsung">
          </div>

          <div class="field">
            <label>وصف المنتج</label>
            <textarea id="productDescription" placeholder="وصف مختصر للمنتج"></textarea>
          </div>

          <div class="field">
            <label>السعر بالدج</label>
            <input id="productPrice" type="number" min="0" step="0.01" placeholder="2500">
          </div>

          <div class="field">
            <label>المخزون</label>
            <input id="productStock" type="number" min="0" step="1" placeholder="10">
          </div>

          <div class="field">
            <label>رابط صورة المنتج (اختياري)</label>
            <input id="productImage" type="url" placeholder="https://...">
          </div>

          <div style="display:flex;gap:10px">

            <button
              class="btn btn-primary"
              style="flex:1"
              onclick="addProduct()">
              حفظ المنتج
            </button>

            <button
              class="btn btn-dark"
              style="flex:1"
              onclick="toggleProductForm()">
              إلغاء
            </button>

          </div>

        </div>


        <div id="productsLoading" class="loading">
          جاري تحميل المنتجات...
        </div>

        <div id="productsGrid" class="product-grid"></div>

      </div>

    </main>

  </section>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kxpzmuxnibmldsmbztgw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_NOYkYqk-zaJ2YeegoBqdbw_P6FMde8L";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentStore = null;


/* =========================
   HELPERS
========================= */

function showPage(page){

  document.getElementById("authPage")
    .classList.add("hidden");

  document.getElementById("createStorePage")
    .classList.add("hidden");

  document.getElementById("dashboardPage")
    .classList.add("hidden");

  document.getElementById(page)
    .classList.remove("hidden");
}


function showMessage(id,text,type="error"){

  const el = document.getElementById(id);

  el.textContent = text;
  el.className = "message " + type;

}


function clearMessage(id){

  const el = document.getElementById(id);

  el.textContent = "";
  el.className = "message";

}


function makeSlug(text){

  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g,"-")
    .replace(/[^\w\u0600-\u06FF-]/g,"")
    .replace(/-+/g,"-");

}


/* =========================
   AUTH UI
========================= */

function showRegister(){

  clearMessage("authMessage");

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("registerForm")
    .classList.remove("hidden");

}


function showLogin(){

  clearMessage("authMessage");

  document.getElementById("registerForm")
    .classList.add("hidden");

  document.getElementById("loginForm")
    .classList.remove("hidden");

}


/* =========================
   REGISTER
========================= */

async function register(){

  clearMessage("authMessage");

  const email =
    document.getElementById("registerEmail")
      .value.trim();

  const password =
    document.getElementById("registerPassword")
      .value;

  if(!email || !password){

    showMessage(
      "authMessage",
      "يرجى إدخال البريد الإلكتروني وكلمة المرور"
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "authMessage",
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
    );

    return;
  }

  const { data,error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    showMessage(
      "authMessage",
      "خطأ Supabase: " + error.message
    );

    return;
  }

  showMessage(
    "authMessage",
    "تم إنشاء الحساب بنجاح. يمكنك الآن الدخول.",
    "success"
  );

  showLogin();

}


/* =========================
   LOGIN
========================= */

async function login(){

  clearMessage("authMessage");

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  if(!email || !password){

    showMessage(
      "authMessage",
      "يرجى إدخال البريد الإلكتروني وكلمة المرور"
    );

    return;
  }

  const { data,error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showMessage(
      "authMessage",
      "خطأ Supabase: " + error.message
    );

    return;
  }

  currentUser = data.user;

  await loadUser();

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  const { data,error } =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    showPage("authPage");

    return;
  }

  currentUser = data.user;


  const result =
    await supabaseClient
      .from("stores")
      .select("*")
      .eq("owner_id",currentUser.id)
      .maybeSingle();


  if(result.error){

    showPage("authPage");

    showMessage(
      "authMessage",
      "خطأ Supabase: " + result.error.message
    );

    return;
  }


  if(!result.data){

    showPage("createStorePage");

    return;
  }


  currentStore = result.data;

  showDashboard();

}


/* =========================
   CREATE STORE
========================= */

async function createStore(){

  clearMessage("storeMessage");

  if(!currentUser){

    showMessage(
      "storeMessage",
      "جلسة المستخدم غير موجودة"
    );

    return;
  }


  const name =
    document.getElementById("storeName")
      .value.trim();

  let slug =
    document.getElementById("storeSlug")
      .value.trim();

  const phone =
    document.getElementById("storePhone")
      .value.trim();

  const wilaya =
    document.getElementById("storeWilaya")
      .value.trim();


  if(!name){

    showMessage(
      "storeMessage",
      "أدخل اسم المتجر"
    );

    return;
  }


  if(!slug){

    slug = makeSlug(name);

  }else{

    slug = makeSlug(slug);

  }


  if(!slug){

    showMessage(
      "storeMessage",
      "أدخل رابطًا صالحًا للمتجر"
    );

    return;
  }


  const { data,error } =
    await supabaseClient
      .from("stores")
      .insert({

        owner_id:currentUser.id,
        name:name,
        slug:slug,
        phone:phone,
        wilaya:wilaya

      })
      .select()
      .single();


  if(error){

    showMessage(
      "storeMessage",
      "خطأ Supabase: " + error.message
    );

    return;
  }


  currentStore = data;

  showDashboard();

}


/* =========================
   DASHBOARD
========================= */

function showDashboard(){

  showPage("dashboardPage");

  document.getElementById("dashboardStoreName")
    .textContent =
      currentStore.name || "متجري";


  let meta = "";

  if(currentStore.slug){

    meta += "الرابط: " +
      currentStore.slug;
  }

  if(currentStore.phone){

    meta += " | الهاتف: " +
      currentStore.phone;
  }

  if(currentStore.wilaya){

    meta += " | الولاية: " +
      currentStore.wilaya;
  }

  document.getElementById("storeMeta")
    .textContent = meta;


  loadProducts();

}


/* =========================
   PRODUCT FORM
========================= */

function toggleProductForm(){

  const form =
    document.getElementById("productForm");

  form.classList.toggle("open");

  if(form.classList.contains("open")){

    document.getElementById("productName")
      .focus();

  }

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct(){

  clearMessage("productMessage");

  if(!currentStore){

    showMessage(
      "productMessage",
      "لم يتم العثور على المتجر"
    );

    return;
  }


  const name =
    document.getElementById("productName")
      .value.trim();

  const description =
    document.getElementById("productDescription")
      .value.trim();

  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );

  const stock =
    Number(
      document.getElementById("productStock")
        .value
    );

  const image =
    document.getElementById("productImage")
      .value.trim();


  if(!name){

    showMessage(
      "productMessage",
      "أدخل اسم المنتج"
    );

    return;
  }


  if(!Number.isFinite(price) || price < 0){

    showMessage(
      "productMessage",
      "أدخل سعرًا صحيحًا"
    );

    return;
  }


  if(!Number.isInteger(stock) || stock < 0){

    showMessage(
      "productMessage",
      "أدخل كمية مخزون صحيحة"
    );

    return;
  }


  const { data,error } =
    await supabaseClient
      .from("products")
      .insert({

        store_id:currentStore.id,
        name:name,
        description:description,
        price:price,
        stock:stock,
        image_url:image,
        available:true,
        featured:false

      })
      .select()
      .single();


  if(error){

    showMessage(
      "productMessage",
      "خطأ Supabase: " + error.message
    );

    return;
  }


  showMessage(
    "productMessage",
    "تم حفظ المنتج بنجاح",
    "success"
  );


  document.getElementById("productName")
    .value = "";

  document.getElementById("productDescription")
    .value = "";

  document.getElementById("productPrice")
    .value = "";

  document.getElementById("productStock")
    .value = "";

  document.getElementById("productImage")
    .value = "";


  await loadProducts();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const loading =
    document.getElementById("productsLoading");

  const grid =
    document.getElementById("productsGrid");


  loading.classList.remove("hidden");

  grid.innerHTML = "";


  if(!currentStore){

    loading.textContent =
      "لم يتم العثور على المتجر";

    return;
  }


  const { data,error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("store_id",currentStore.id)
      .order("created_at",{ascending:false});


  loading.classList.add("hidden");


  if(error){

    grid.innerHTML =
      '<div class="empty">خطأ Supabase: ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  const products = data || [];


  document.getElementById("productsCount")
    .textContent = products.length;


  if(products.length === 0){

    grid.innerHTML =
      '<div class="empty" style="grid-column:1/-1">' +
      'لا توجد منتجات حتى الآن.<br>' +
      'اضغط «+ إضافة منتج» لإضافة أول منتج.' +
      '</div>';

    return;
  }


  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "product-card";


    let imageHTML = "";

    if(product.image_url){

      imageHTML =
        '<img class="product-image" src="' +
        escapeAttribute(product.image_url) +
        '" alt="' +
        escapeAttribute(product.name) +
        '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +

        '<div class="no-image" style="display:none">' +
        'بدون صورة' +
        '</div>';

    }else{

      imageHTML =
        '<div class="no-image">بدون صورة</div>';

    }


    card.innerHTML =

      imageHTML +

      '<div class="product-info">' +

      '<div class="product-name">' +
      escapeHtml(product.name) +
      '</div>' +

      '<div class="product-price">' +
      formatPrice(product.price) +
      ' دج' +
      '</div>' +

      '<div class="product-stock">' +
      'المخزون: ' +
      Number(product.stock || 0) +
      '</div>' +

      '<button class="delete-product" onclick="deleteProduct(\'' +
      product.id +
      '\')">' +
      'حذف المنتج' +
      '</button>' +

      '</div>';


    grid.appendChild(card);

  });

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  if(!confirm("هل تريد حذف هذا المنتج؟")){

    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id)
      .eq("store_id",currentStore.id);


  if(error){

    alert(
      "خطأ Supabase: " +
      error.message
    );

    return;
  }


  await loadProducts();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentStore = null;

  showPage("authPage");

  showLogin();

}


/* =========================
   FORMAT
========================= */

function formatPrice(value){

  return Number(value || 0)
    .toLocaleString("ar-DZ");

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================
   START
========================= */

(async function(){

  const { data } =
    await supabaseClient.auth.getSession();

  if(data && data.session){

    currentUser = data.session.user;

    await loadUser();

  }else{

    showPage("authPage");

  }

})();

</script>
